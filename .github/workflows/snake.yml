name: Serpent des contributions

on:
  schedule:
    - cron: "0 3 * * *" # tous les jours à 3 h (UTC)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Couleurs de Prime : fond noir, menthe et lime.
      - name: Générer le serpent
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=#c6ff3d&color_dots=#15121a,#06573d,#00cc84,#2effb0,#b8ffe3&color_dot_border=#020106&color_background=#020106
            dist/snake-light.svg?color_snake=#00cc84&color_dots=#e6e2dc,#d4fff0,#8fd400,#00cc84,#06573d&color_dot_border=#f2efea

      - name: Publier sur la branche output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
